[machine]
name      = ZXM-Phoenix
family    = clone
hw        = Phoenix
# revision 08.1: Beta Disk, Nemo IDE and the multicard's clock are on the board
builtin   = disk ide clock
memory    = 2048
cpu.frq   = 3500000
cpu.turbo = 1,2

[video]
geometry  = ULA.Phoenix
4t-border = yes
floatbus  = none

[sound]
psg.count  = 2
psg.type   = ym
psg.stereo = abc

[storage]
disk        = trdos
ide         = nemo
zcontroller = yes

[input]
mouse       = yes
mouse.wheel = yes
joy         = kempston

[rom]
rom0 = phoenix-07.rom
gs   = gs105b.rom
