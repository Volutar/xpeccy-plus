[machine]
name      = Pentagon
family    = clone
hw        = Pentagon
memory    = 128
# Cold ram, read off a photo of a real Pentagon 128 at power-on: ff or 00
# by the parity of address bits 3 and 6, so the screen comes up in blocks
# eight characters wide and two rows tall, with 18 bytes in a thousand
# coming up wrong in it.
ram.cold  = ff*8 00*8 ff*8 00*8 ff*8 00*8 ff*8 00*8 00*8 ff*8 00*8 ff*8 00*8 ff*8 00*8 ff*8
ram.noise = 18
cpu.frq   = 3500000

[video]
geometry = ULA.Pentagon
floatbus = attr

[sound]
psg.type   = ym
psg.frq    = 1.75
psg.stereo = abc
soundrive  = covox

[storage]
disk = trdos

[input]
mouse       = yes
joy.buttons = yes

[rom]
rom0 = 128p-0.rom
rom1 = 128p-1.rom
rom2 = gluck.rom
rom3 = trdos504t.rom
gs   = gs105b.rom
