[machine]
name      = ZX Evolution (TSConf)
family    = evolution
hw        = TSConf
builtin   = disk ide
memory    = 4096
ram.cold  = aa55
ram.noise = 2
cpu.frq   = 3500000
cpu.turbo = 1,2,4

[video]
geometry = ULA.TSConf
floatbus = attr

[sound]
psg.count  = 2
psg.type   = ym
psg.stereo = abc
soundrive  = covox

[storage]
disk = trdos
ide  = nemo-evo

[input]
kbd.scantab = at
mouse       = yes
mouse.wheel = yes
joy.buttons = yes

[rom]
rom0 = tsconf.rom
gs   = gs105b.rom
font = sgen.rom
