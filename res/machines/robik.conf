[machine]
name    = Robik
family  = clone
hw      = Robik
memory  = 48
# the crystal is about 13.3 MHz on most boards (13.0-14.0 seen), the CPU at a quarter
cpu.frq = 3325000
contio  = no
contmem = no
reset   = basic48
# the 16K under the ROM, in and out by port 15 (not on every board)
shadow  = yes

[video]
geometry   = ULA.Robik
snow       = no
floatbus   = none
# BRIGHT is not wired on the factory board: every colour bright
bright     = no
# the thin line where a cell's attribute changes, as on most boards
cell.edges = yes

[sound]
beeper     = piezo
beeper.mic = no
psg.count  = 0

[input]
joy = kempston

[rom]
banks = 1
rom0 = robik.rom
