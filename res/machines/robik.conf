[machine]
name    = Robik
family  = clone
hw      = Robik
memory  = 48
# the crystal is about 13.3 MHz on most boards (13.0-14.0 seen), the CPU at a quarter
cpu.frq = 3325000
contio  = no
contmem = no
reset   = basic48
# the 16K under the ROM, in and out by port 15 (not on every board)
shadow  = robik

[video]
geometry   = ULA.Robik
snow       = no
floatbus   = none
# BRIGHT is not wired on the factory board: every color bright
bright     = no
# the thin line where a cell's attribute changes, as on most boards
cell.edges = yes

[sound]
beeper     = piezo
beeper.mic = no
psg.count  = 0

[input]
joy = kempston

[rom]
banks = 4
rom0 = robik.rom
# a board taken to 128K by its owner (Options, Memory) pages these two instead: the
# Pentagon 128's, its editor and the 48 BASIC that editor calls
rom2 = 128p-0.rom
rom3 = 128p-1.rom
