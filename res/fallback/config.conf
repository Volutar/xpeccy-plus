# What Xpeccy+ starts as when there is no config file yet. It is the same
# settings the emulator ships with, so a fresh start and a shipped install
# look alike. Machines, layouts, palettes, shaders, styles and keymaps are
# in the binary; only what you change is written back beside this file.

[GENERAL]

schema = 4
machine = zx128
savepaths = yes
fdcturbo = yes
addboot = yes
autorun = yes
exit.confirm = no
port = 30000
winpos = -1,-1
flpinterleave = 8
style =

[VIDEO]

scrFormat = png
scrCount = 50
scrInterval = 1
scrNoLeds = yes
scrNoBord = no
fullscreen = no
keepratio = yes
lowlatency = yes
scale = 2
greyscale = no
border = full
noflick = 0
noflick.mode = 0
noflick.gamma = 2.200000
shader = tvline-nocurve-light.txt

[SOUND]

enabled = yes
soundsys = SDL
latency = 30
latency_auto = yes
volume.master = 100
volume.beep = 100
volume.tape = 80
volume.ay = 40
volume.gs = 100
volume.sdrv = 100
volume.saa = 100

[TAPE]

autoplay = yes
flash = yes
fast = yes
rewind = no

[INPUT]

deadzone = 8192
deadzone2 = 8192

[LEDS]

mouse = yes
joystick = yes
keyscan = yes
tape = yes
disk = yes
message = yes
fps = no
halt = yes

[DEBUGA]

dbsize = 8
dwsize = 4
dmsize = 32
scr.zoom = 1
window = -1:-1:-1:-1

[LOG]

enabled = no
console = yes
level = info
