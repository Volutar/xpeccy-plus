name: Release

# Builds every platform from a version tag and leaves a draft release with the
# six archives attached and the list of which file is for which system, so the
# notes can be written above it after seeing what was actually built.
# Publishing stays a manual click.
#
#   git tag v2026.1 && git push origin v2026.1
#
# The tag must match the VERSION file: a version in an artifact's name comes
# from that file, not from the tag, and the two disagreeing is worse than a
# failed build.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  check:
    name: check the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          want=$(head -n 1 VERSION | tr -d ' \r\n')
          got=${GITHUB_REF_NAME#v}
          echo "tag:     $got"
          echo "VERSION: $want"
          [ "$want" = "$got" ] || { echo "The tag and the VERSION file disagree."; exit 1; }

  linux:
    needs: check
    uses: ./.github/workflows/linux.yml
    with:
      release: true

  macos:
    needs: check
    uses: ./.github/workflows/macos.yml
    with:
      release: true

  windows:
    needs: check
    uses: ./.github/workflows/windows.yml
    # PGO_SSH_KEY: the private training set
    secrets: inherit
    with:
      release: true
      arm64: true

  publish:
    name: draft the release
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # skip-decompress: every artifact here was uploaded with archive: false,
      # so what is stored is the finished file - unpacking it would give the
      # contents of a zip that is itself the thing being released
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          skip-decompress: true

      # the script that writes the page's list of files
      - uses: actions/checkout@v7
        with:
          path: src
          sparse-checkout: packaging

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          # gh reads the repository off a git remote unless it is told which one,
          # and the copy in src/ is not where this runs
          GH_REPO: ${{ github.repository }}
        run: |
          ls -lh dist
          # the draft holds the end of the page: which file is for which system,
          # with links. The notes written later go above it, before the rule
          { echo "---"; echo; sh src/packaging/release-files.sh "$GITHUB_REF_NAME" "xpeccy-plus-${GITHUB_REF_NAME#v}"; } > "$RUNNER_TEMP/files.md"
          cat "$RUNNER_TEMP/files.md"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft \
            --verify-tag \
            --title "Xpeccy+ ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/files.md"
          echo "Draft release $GITHUB_REF_NAME is ready to review and publish." >> "$GITHUB_STEP_SUMMARY"
