name: macOS

# Builds the arm64 bundle and the dmg that nightly.yml and release.yml publish.
# The signature on it is ad-hoc, which is all arm64 needs to run a binary but
# not what Gatekeeper wants to see on a downloaded image.
#
# Started by hand, from the Actions tab or "gh workflow run macos.yml --ref
# <branch>"; tick "release" for a clean version string instead of the dated dev
# one. Nothing here triggers on a push: six minutes per commit to tell nobody
# anything. Worth a run before merging something that touches the build, the
# sources or the bundled config.

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release version string, no -dev+DATE suffix'
        type: boolean
        default: false
  # nightly.yml and release.yml build through this one
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
  # SDL comes from Homebrew, which rolls forward on its own, so this can
  # break with nobody having touched the repository - that is how the whole
  # sdl2-compat business started. Once a week is enough to notice.
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  # github.workflow is the caller's name when this workflow is called, so a
  # nightly and a release build cannot cancel each other
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: arm64, Qt6, macOS 15+
    # Pinned, not macos-latest: Homebrew's arm64 bottles are tagged to the OS
    # they were built on, so this is what actually sets the app's minimum
    # macOS. macos-14 runners are gone (2026-11).
    runs-on: macos-15
    timeout-minutes: 40

    env:
      BUILD_DIR: build
      DIST_DIR: dist
      APP: dist/xpeccy-plus.app
      # Qt's own build: Homebrew bottles nothing past 6.11.1 for macOS 14, and
      # 6.11.1 crashes at start on macOS 27.2
      QT_VERSION: 6.11.3

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/python3" -m pip install --disable-pip-version-check aqtinstall
          # the mirrors hand out a corrupt archive now and then
          for i in 1 2 3; do
            "$RUNNER_TEMP/aqt/bin/aqt" install-qt mac desktop "$QT_VERSION" clang_64 -m qt5compat -O "$RUNNER_TEMP/Qt" && break
            [ $i = 3 ] && exit 1
            echo "::warning::aqt failed (attempt $i of 3), retrying"
            sleep 15
          done
          echo "QT_DIR=$RUNNER_TEMP/Qt/$QT_VERSION/macos" >> "$GITHUB_ENV"

      - name: Install SDL2
        run: brew install sdl2

      # a venv: Homebrew's python refuses a plain pip install
      - name: Build the manual
        run: |
          python3 -m venv "$RUNNER_TEMP/docs"
          "$RUNNER_TEMP/docs/bin/python3" -m pip install --disable-pip-version-check -r docs/manual/requirements.txt
          "$RUNNER_TEMP/docs/bin/python3" tools/manual.py html

      - name: Configure
        run: |
          cmake -S . -B "$BUILD_DIR" \
            -DMANUAL_DIR="$PWD/build/manual" \
            -DCMAKE_BUILD_TYPE=Release \
            -DXRELEASE=${{ inputs.release && 'ON' || 'OFF' }} \
            -DCMAKE_PREFIX_PATH="$QT_DIR" \
            -DQTVERSION=6 \
            -DUSEOPENGL=1 \
            -DUSEQTNETWORK=1 \
            -DSDL1BUILD=0 \
            -DXPACKAGE=macos-arm64-qt6

      - name: Build
        run: cmake --build "$BUILD_DIR" -j "$(sysctl -n hw.ncpu)"

      - name: Install
        run: cmake --install "$BUILD_DIR" --prefix "$DIST_DIR"

      - name: Smoke test
        timeout-minutes: 5
        env:
          TMPDIR: ${{ runner.temp }}
        run: packaging/macos-smoke.sh "$APP" "$RUNNER_TEMP/xpeccy-conf"

      - name: Check the bundle is self-contained
        run: |
          otool -L "$APP/Contents/MacOS/xpeccy-plus"
          if otool -L "$APP/Contents/MacOS/xpeccy-plus" | grep -q -e "$(brew --prefix)/" -e "$QT_DIR/"; then
            echo "the binary still links against Homebrew or Qt build paths"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package
        run: |
          cpack --config "$BUILD_DIR/CPackConfig.cmake" -B "$BUILD_DIR"
          dmg=$(ls "$BUILD_DIR"/*.dmg)
          # the artifact is named after the image, so the two cannot drift apart
          echo "DMG=$dmg" >> "$GITHUB_ENV"
          echo "DMG_NAME=$(basename "$dmg" .dmg)" >> "$GITHUB_ENV"

      # the dmg is what a tester gets, so test that and not only the staged copy
      - name: Test the dmg
        timeout-minutes: 5
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          MNT="$RUNNER_TEMP/dmg"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT"
          packaging/macos-smoke.sh "$MNT/xpeccy-plus.app" "$RUNNER_TEMP/dmg-conf"
          # cleanup, not a check: the volume is sometimes still busy right after
          hdiutil detach "$MNT" -force || echo "could not unmount, never mind"

      - name: Upload what was on screen when it hung
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hang-screenshot
          path: ${{ runner.temp }}/xpeccy-hang.png
          if-no-files-found: ignore

      - name: Summary
        run: |
          {
            echo "| | |"
            echo "|---|---|"
            echo "| macOS | $(sw_vers -productVersion) ($(uname -m)) |"
            echo "| Qt | $QT_VERSION (qt.io) |"
            echo "| SDL | $(brew list --versions sdl2 | cut -d' ' -f2) (sdl2-compat) |"
            echo "| dmg | $DMG_NAME.dmg, $(du -h "$DMG" | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      # archive: false - the download is the dmg itself, not a zip holding one.
      # It also means the artifact is named after the file, so no name here
      - name: Upload the dmg
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.DMG }}
          archive: false
          retention-days: 30
          if-no-files-found: error
