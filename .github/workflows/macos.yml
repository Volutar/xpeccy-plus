name: macOS

# Builds the arm64 bundle and the dmg that nightly.yml and release.yml publish.
# The signature on it is ad-hoc, which is all arm64 needs to run a binary but
# not what Gatekeeper wants to see on a downloaded image.
#
# Started by hand, from the Actions tab or "gh workflow run macos.yml --ref
# <branch>"; tick "release" for a clean version string instead of the dated dev
# one. Nothing here triggers on a push: six minutes per commit to tell nobody
# anything. Worth a run before merging something that touches the build, the
# sources or the bundled config.

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release version string, no -dev+DATE suffix'
        type: boolean
        default: false
  # nightly.yml and release.yml build through this one
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
  # Qt and SDL are pinned, but the runner image and its Xcode roll forward on
  # their own, so this can break with nobody having touched the repository.
  # Once a week is enough to notice.
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  # github.workflow is the caller's name when this workflow is called, so a
  # nightly and a release build cannot cancel each other
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: arm64, Qt6, macOS 13+
    # The runner does not set the oldest macOS the app runs on: MACOS_FLOOR
    # does, for our build and SDL's, and a step below checks every binary in
    # the bundle against it. Pinned anyway, so a new image arrives on purpose.
    runs-on: macos-15
    timeout-minutes: 40

    env:
      BUILD_DIR: build
      DIST_DIR: dist
      APP: dist/xpeccy-plus.app
      # Qt's own build: Homebrew bottles nothing past 6.11.1 for macOS 14, and
      # 6.11.1 crashes at start on macOS 27.2
      QT_VERSION: 6.11.3
      # Qt 6.11's own minimum; CMakeLists.txt defaults to the same for local builds
      MACOS_FLOOR: '13.0'

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/python3" -m pip install --disable-pip-version-check aqtinstall
          # the mirrors hand out a corrupt archive now and then
          for i in 1 2 3; do
            "$RUNNER_TEMP/aqt/bin/aqt" install-qt mac desktop "$QT_VERSION" clang_64 -m qt5compat -O "$RUNNER_TEMP/Qt" && break
            [ $i = 3 ] && exit 1
            echo "::warning::aqt failed (attempt $i of 3), retrying"
            sleep 15
          done
          echo "QT_DIR=$RUNNER_TEMP/Qt/$QT_VERSION/macos" >> "$GITHUB_ENV"

      # Not Homebrew's: its bottles need the macOS they were built on, and its
      # sdl2 is a shim over SDL3. The version is the one Windows ships.
      - name: SDL2 version
        run: |
          echo "SDL2_VERSION=$(jq -r .sdl2.version packaging/deps.json)" >> "$GITHUB_ENV"
          echo "SDL2_SHA256=$(jq -r .sdl2.source_sha256 packaging/deps.json | tr A-F a-f)" >> "$GITHUB_ENV"
          echo "SDL2DIR=$RUNNER_TEMP/sdl2" >> "$GITHUB_ENV"

      - name: Cache SDL2
        id: sdl2-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/sdl2
          # the workflow's hash: a change to the build step below rebuilds it
          key: sdl2-${{ env.SDL2_VERSION }}-macos${{ env.MACOS_FLOOR }}-arm64-${{ hashFiles('.github/workflows/macos.yml') }}

      - name: Build SDL2
        if: steps.sdl2-cache.outputs.cache-hit != 'true'
        run: |
          tgz="$RUNNER_TEMP/SDL2-$SDL2_VERSION.tar.gz"
          curl -fsSL --retry 3 -o "$tgz" "https://github.com/libsdl-org/SDL/releases/download/release-$SDL2_VERSION/SDL2-$SDL2_VERSION.tar.gz"
          echo "$SDL2_SHA256  $tgz" | shasum -a 256 -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/SDL2-$SDL2_VERSION" -B "$RUNNER_TEMP/sdl2-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_FLOOR" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_INSTALL_PREFIX="$SDL2DIR" \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DSDL_TEST=OFF \
            -DSDL_TESTS=OFF
          cmake --build "$RUNNER_TEMP/sdl2-build" -j "$(sysctl -n hw.ncpu)"
          cmake --install "$RUNNER_TEMP/sdl2-build"

      # a venv: Homebrew's python refuses a plain pip install
      - name: Build the manual
        run: |
          python3 -m venv "$RUNNER_TEMP/docs"
          "$RUNNER_TEMP/docs/bin/python3" -m pip install --disable-pip-version-check -r docs/manual/requirements.txt
          "$RUNNER_TEMP/docs/bin/python3" tools/manual.py html

      - name: Configure
        run: |
          cmake -S . -B "$BUILD_DIR" \
            -DMANUAL_DIR="$PWD/build/manual" \
            -DCMAKE_BUILD_TYPE=Release \
            -DXRELEASE=${{ inputs.release && 'ON' || 'OFF' }} \
            -DCMAKE_PREFIX_PATH="$QT_DIR" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_FLOOR" \
            -DQTVERSION=6 \
            -DUSEOPENGL=1 \
            -DUSEQTNETWORK=1 \
            -DSDL1BUILD=0 \
            -DXPACKAGE=macos-arm64-qt6

      - name: Build
        run: cmake --build "$BUILD_DIR" -j "$(sysctl -n hw.ncpu)"

      - name: Install
        run: cmake --install "$BUILD_DIR" --prefix "$DIST_DIR"

      # CI cannot start the app on anything older than the runner, so this is
      # the proof the floor holds: one library built for a newer macOS and dyld
      # refuses the whole app there
      - name: Check the oldest macOS
        run: |
          plist=$(plutil -extract LSMinimumSystemVersion raw "$APP/Contents/Info.plist")
          echo "Info.plist: LSMinimumSystemVersion $plist"
          if [ "$plist" != "$MACOS_FLOOR" ]; then
            echo "::error::Info.plist says $plist, the floor is $MACOS_FLOOR"
            exit 1
          fi
          n=0; bad=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q Mach-O || continue
            n=$((n + 1))
            # one value per architecture. An old LC_VERSION_MIN_MACOSX says
            # "version"; so does every build tool listed under LC_BUILD_VERSION
            for v in $(vtool -show-build "$f" | awk '$1 == "cmd" { c = $2 } $1 == "minos" || ($1 == "version" && c == "LC_VERSION_MIN_MACOSX") { print $2 }'); do
              echo "$v  ${f#"$APP"/}"
              if awk -v a="$v" -v b="$MACOS_FLOOR" 'BEGIN { split(a, x, "."); split(b, y, "."); exit !(x[1] * 100 + x[2] > y[1] * 100 + y[2]) }'; then
                echo "::error::${f#"$APP"/} needs macOS $v, the floor is $MACOS_FLOOR"
                bad=1
              fi
            done
          done < <(find "$APP" -type f -print0)
          echo "$n Mach-O files"
          [ "$n" -gt 0 ] && [ "$bad" = 0 ]

      - name: Smoke test
        timeout-minutes: 5
        env:
          TMPDIR: ${{ runner.temp }}
        run: packaging/macos-smoke.sh "$APP" "$RUNNER_TEMP/xpeccy-conf"

      - name: Check the bundle is self-contained
        run: |
          otool -L "$APP/Contents/MacOS/xpeccy-plus"
          if otool -L "$APP/Contents/MacOS/xpeccy-plus" | grep -q -e "$(brew --prefix)/" -e "$QT_DIR/"; then
            echo "the binary still links against Homebrew or Qt build paths"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package
        run: |
          cpack --config "$BUILD_DIR/CPackConfig.cmake" -B "$BUILD_DIR"
          dmg=$(ls "$BUILD_DIR"/*.dmg)
          # the artifact is named after the image, so the two cannot drift apart
          echo "DMG=$dmg" >> "$GITHUB_ENV"
          echo "DMG_NAME=$(basename "$dmg" .dmg)" >> "$GITHUB_ENV"

      # the dmg is what a tester gets, so test that and not only the staged copy
      - name: Test the dmg
        timeout-minutes: 5
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          MNT="$RUNNER_TEMP/dmg"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT"
          packaging/macos-smoke.sh "$MNT/xpeccy-plus.app" "$RUNNER_TEMP/dmg-conf"
          # cleanup, not a check: the volume is sometimes still busy right after
          hdiutil detach "$MNT" -force || echo "could not unmount, never mind"

      - name: Upload what was on screen when it hung
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hang-screenshot
          path: ${{ runner.temp }}/xpeccy-hang.png
          if-no-files-found: ignore

      - name: Summary
        run: |
          {
            echo "| | |"
            echo "|---|---|"
            echo "| macOS | built on $(sw_vers -productVersion) ($(uname -m)), runs on $MACOS_FLOOR+ |"
            echo "| Qt | $QT_VERSION (qt.io) |"
            echo "| SDL | $SDL2_VERSION (built here) |"
            echo "| dmg | $DMG_NAME.dmg, $(du -h "$DMG" | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      # archive: false - the download is the dmg itself, not a zip holding one.
      # It also means the artifact is named after the file, so no name here
      - name: Upload the dmg
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.DMG }}
          archive: false
          retention-days: 30
          if-no-files-found: error
